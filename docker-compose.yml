name: proyecto_final

# Un solo comando levanta todo:  docker compose up -d
#   Kestra    http://localhost:8080   orquestación (ingesta, lotes, monitoreo, reentrenamiento)
#   Spark     http://localhost:8082   construcción de la OBT
#   MLflow    http://localhost:5050   tracking y Model Registry (alias champion / challenger)
#   API       http://localhost:8000   servicio de predicción (docs en /docs)
#   Tablero   http://localhost:8501   monitoreo lote por lote
#
# Los volúmenes llevan nombre fijo: conservan la historia de Kestra (PSet 2) y de
# MLflow (PSet 3) si ya existen, y se crean vacíos en una máquina nueva.

x-snowflake: &snowflake
  SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:?Completa SNOWFLAKE_ACCOUNT en .env}
  SNOWFLAKE_USER: ${SNOWFLAKE_USER:?Completa SNOWFLAKE_USER en .env}
  SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-PSET2_ROLE}
  SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-PSET2_WH}
  SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-PSET2_DB}
  SNOWFLAKE_OBT_TABLE: ${SNOWFLAKE_OBT_TABLE:-ANALYTICS.OBT_SALES}
  SNOWFLAKE_PRIVATE_KEY_FILE: /run/secrets/snowflake_private_key
  SNOWFLAKE_PRIVATE_KEY_PASSPHRASE_FILE: /run/secrets/snowflake_passphrase

services:
  # ---------------------------------------------------------------- Kestra
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - kestra_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U kestra -d kestra']
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  kestra:
    build:
      context: .
      dockerfile: kestra/Dockerfile
    image: proyecto-final-kestra:1.3.0
    user: root
    command: server standalone
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      <<: *snowflake
      SNOWFLAKE_SCHEMA: RAW
      JAVA_OPTS: '-Xms256m -Xmx1024m'
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
        kestra:
          server:
            basicAuth:
              enabled: true
              username: ${KESTRA_USERNAME:-local@proyecto.test}
              password: ${KESTRA_PASSWORD:?Configura KESTRA_PASSWORD en .env}
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              basePath: /app/storage
          tasks:
            tmpDir:
              path: /tmp/kestra-wd
          url: http://localhost:8080/
      PSET2_NON_INTERACTIVE: '1'
      DATA_DIR: /input
      MLFLOW_TRACKING_URI: http://mlflow:5000
      API_URL: http://api:8000
      API_TOKEN_ADMIN: ${API_TOKEN_ADMIN:-}
    secrets:
      - snowflake_private_key
      - snowflake_passphrase
    volumes:
      - kestra_data:/app/storage
      - registros:/registros
      - ./snowflake:/workspace/snowflake:ro
      - ./kestra:/workspace/kestra:ro
      - ./dbt:/workspace/dbt
      - ./spark:/workspace/spark:ro
      - ./src:/workspace/src:ro
      - ./monitoreo:/workspace/monitoreo:ro
      - ./api:/workspace/api:ro
      - ./data:/workspace/data
      - ${DATA_DIR:-.}/items.csv:/input/items.csv:ro
      - ${DATA_DIR:-.}/stores.csv:/input/stores.csv:ro
      - ${DATA_DIR:-.}/oil.csv:/input/oil.csv:ro
      - ${DATA_DIR:-.}/transactions.csv:/input/transactions.csv:ro
      - ${DATA_DIR:-.}/holidays_events.csv:/input/holidays_events.csv:ro
      - ${DATA_DIR:-.}/train.csv:/input/train.csv:ro
    mem_limit: 4g

  # ----------------------------------------------------------------- Spark
  spark:
    image: apache/spark:3.5.3-python3
    command: ['/opt/spark/bin/spark-class', 'org.apache.spark.deploy.master.Master', '--host', 'spark']
    ports:
      - '127.0.0.1:8082:8080'
    volumes:
      - ./spark:/workspace/spark:ro
    mem_limit: 1g

  # ---------------------------------------------------------------- MLflow
  mlflow-db:
    image: postgres:16.6
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_POSTGRES_PASSWORD:?Configura MLFLOW_POSTGRES_PASSWORD en .env}
    volumes:
      - mlflow_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mlflow -d mlflow']
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  mlflow:
    build: ./mlflow
    image: pset3-mlflow:3.18.0
    depends_on:
      mlflow-db:
        condition: service_healthy
    environment:
      # Solo se usa tracking y registro: se desactiva el job runner de tareas GenAI.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: 'false'
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000 --workers 2
      --backend-store-uri postgresql+psycopg2://mlflow:${MLFLOW_POSTGRES_PASSWORD}@mlflow-db:5432/mlflow
      --serve-artifacts --artifacts-destination /mlartifacts
      --allowed-hosts localhost:*,127.0.0.1:*,mlflow:*
    ports:
      - '127.0.0.1:5050:5000'
    volumes:
      - mlflow_artifacts:/mlartifacts
    healthcheck:
      test: [CMD-SHELL, "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    restart: unless-stopped

  # ------------------------------------------------------------------- API
  # La imagen la publica cd.yml en GHCR con el hash del commit como tag
  # (API_TAG en .env). Sin API_TAG se construye localmente.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ghcr.io/livianita/pset4_rojas_barazarte-api:${API_TAG:-local}
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ALIAS_MODELO: champion
      REFRESCO_SEG: '30'
      MODO_RESPALDO: ${MODO_RESPALDO:-false}
      API_TOKEN_ADMIN: ${API_TOKEN_ADMIN:-}
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - registros:/registros
    mem_limit: 1g
    restart: unless-stopped

volumes:
  kestra_db:
    name: pset2_postgres_data
  kestra_data:
    name: pset2_kestra_data
  mlflow_db:
    name: pset3_mlflow_db
  mlflow_artifacts:
    name: pset3_mlflow_artifacts
  registros:
    name: proyecto_final_registros

secrets:
  snowflake_private_key:
    file: ${SNOWFLAKE_PRIVATE_KEY_FILE:-.secrets/snowflake_key.p8}
  snowflake_passphrase:
    file: ${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE_FILE:-.secrets/snowflake_passphrase.txt}
