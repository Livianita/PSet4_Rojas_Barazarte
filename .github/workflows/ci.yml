# Integración continua: en cada push y en cada pull request se instalan las
# dependencias, se ejecuta pytest, se construye la imagen de la API y se prueba
# el contenedor. En CI no hay servidor de MLflow: el modelo viene de
# tests/fixtures/modelo (exportado con mlflow.sklearn.save_model).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas e imagen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            tests/requirements.txt

      - name: Instalar dependencias
        run: pip install -r tests/requirements.txt

      - name: Ejecutar pytest
        env:
          MLFLOW_ALLOW_MODEL_CODE_EXECUTION: 'true'
        run: pytest -v

      - name: Construir la imagen de la API
        run: docker build -f api/Dockerfile -t favorita-api:ci .

      - name: Probar el contenedor con el modelo de fixtures
        run: |
          docker run -d --name api -p 8000:8000 \
            -e MODELO_URI=/modelo -e MODELO_VERSION_LOCAL=fixture \
            -v "$PWD/tests/fixtures/modelo:/modelo:ro" favorita-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/salud && break; sleep 2; done
          echo
          curl -s localhost:8000/salud | python -c "import sys, json; s = json.load(sys.stdin); assert s['modelo_cargado'], s"
          python - <<'EOF'
          import json, urllib.request
          import pandas as pd
          X = pd.read_parquet('tests/fixtures/muestra_fija.parquet').drop(columns='UNIT_SALES_TARGET')
          fila = X.iloc[0].to_dict()
          fila['DATE'] = str(pd.Timestamp(fila['DATE']).date())
          fila = {k: (None if isinstance(v, float) and pd.isna(v) else (v.item() if hasattr(v, 'item') else v))
                  for k, v in fila.items()}
          pedido = urllib.request.Request('http://localhost:8000/predecir', data=json.dumps(fila).encode(),
                                          headers={'Content-Type': 'application/json'})
          respuesta = json.load(urllib.request.urlopen(pedido))
          print(respuesta)
          assert respuesta['respaldo'] is False and respuesta['version_modelo'] == 'fixture'
          EOF

      - name: Logs del contenedor
        if: always()
        run: docker logs api || true
