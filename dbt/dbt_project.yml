name: pset2
version: '1.0.0'
config-version: 2
profile: pset2
model-paths: [models]
test-paths: [tests]
macro-paths: [macros]
clean-targets: [target, dbt_packages]
models:
  pset2:
    bronze:
      +materialized: table
    silver:
      +materialized: table
      +schema: SILVER
    gold:
      +materialized: table
      +schema: GOLD
      dimensions:
        +tags: [gold_dimensions]
      context:
        +tags: [gold_context]
